services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jazcrm
      POSTGRES_PASSWORD: jazcrm
      POSTGRES_DB: jazcrm
    ports:
      - "55532:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jazcrm"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    environment:
      DATABASE_URL: postgres://jazcrm:jazcrm@postgres:5432/jazcrm?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7500}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_API_KEY: ${OWNER_API_KEY:-}
    ports:
      - "7500:7500"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
