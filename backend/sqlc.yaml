version: "2"
overrides:
  go:
    rename:
      ids: IDs
      record_ids: RecordIDs
      connection_ids: ConnectionIDs
      handle_ids: HandleIDs
      message_ids: MessageIDs
      handle_values: Values
      provider_id: ProviderID
      author_handle_id: AuthorHandleID
      person_id: PersonID
      company_page_id: CompanyPageID
      company_page_ids: CompanyPageIDs
      meet_code: MeetCode
      attribute_ids: AttributeIDs
      ref_record_id: RefRecordID
      target_object_id: TargetObjectID
      row_limit: Limit
      row_offset: Offset
      avatar_url: AvatarURL
      photo_url: PhotoURL
      html: HTML
      png: PNG
      redirect_uris: RedirectURIs
      redirect_uri: RedirectURI
      oauth_client: OAuthClient
      oauth_code: OAuthCode
      oauth_grant: OAuthGrant
      oauth_token: OAuthToken
      api_key: APIKey
    overrides:
      - db_type: uuid
        go_type: string
      - db_type: uuid
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
sql:
  - engine: postgresql
    schema: internal/storage/postgres/migrations
    queries: internal/storage/postgres/queries/auth
    gen:
      go:
        package: auth
        out: internal/storage/postgres/generated/auth
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/storage/postgres/migrations
    queries: internal/storage/postgres/queries/records
    gen:
      go:
        package: records
        out: internal/storage/postgres/generated/records
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/storage/postgres/migrations
    queries: internal/storage/postgres/queries/connections
    gen:
      go:
        package: connections
        out: internal/storage/postgres/generated/connections
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/storage/postgres/migrations
    queries: internal/storage/postgres/queries/interactions
    gen:
      go:
        package: interactions
        out: internal/storage/postgres/generated/interactions
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/storage/postgres/migrations
    queries: internal/storage/postgres/queries/logos
    gen:
      go:
        package: logos
        out: internal/storage/postgres/generated/logos
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
