name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jazcrm
          POSTGRES_PASSWORD: jazcrm
          POSTGRES_DB: jazcrm
        ports: ['55532:5432']
        options: --health-cmd="pg_isready -U jazcrm" --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Set up Bun
        run: |
          mkdir -p runs/bun
          curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip -o runs/bun.zip
          echo '951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  runs/bun.zip' | sha256sum --check
          unzip -q runs/bun.zip -d runs/bun
          echo "$PWD/runs/bun/bun-linux-x64" >> "$GITHUB_PATH"
      - working-directory: frontend
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          bun install --frozen-lockfile
          bun run check
      - working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, worker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Publish ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$TARGET"
          tags=(--tag "$image:$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$image:latest")
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(--tag "$image:$GITHUB_REF_NAME")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target "$TARGET" "${tags[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --push .
          docker buildx imagetools inspect "$image:$GITHUB_SHA"
          docker pull "$image:$GITHUB_SHA"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image:$GITHUB_SHA")" = "[\"/app/$TARGET\"]"
